function download(name,content){

function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);}
function makeId(it){const key=norm(it.stem)+'|'+norm(it.question)+'|'+(it.options||[]).map(o=>norm(o.text)).join('|');

const _key=s=>String(s).toLowerCase().replace(/[\s_\-]/g,'');
function canon(s,table){
  if(s==null)return'';const raw=String(s).trim();if(!raw)return'';const k=_key(raw);
  for(const[c,arr]of Object.entries(table))if(_key(c)===k||arr.some(a=>_key(a)===k))return c;
  return raw;
}
const subList=(subj,sys)=>((TAX[subj]||{})[sys])||[];
function findSub(subj,s,cands){
  const T=TAX[subj];if(!T)return null;const k=nk(s);if(!k)return null;
  const order=[...cands.filter(x=>T[x]),...Object.keys(T).filter(x=>!cands.includes(x))];
  for(const sys of order)for(const name of T[sys])if(nk(name)===k)return{sys,name};
  if(k.length>=3)for(const sys of order)for(const name of T[sys]){const n=nk(name);if(n.includes(k)||k.includes(n))return{sys,name};}
  return null;
}
// 기존 문항 자동 분류: 주제(topic) > 학습목표 > 질문 > 증례 순으로 가중치를 둔 키워드 점수
function classifySub(it,cands){
  const T=TAX[it.subject];if(!T)return null;
  let sysList=(cands||[]).filter(s=>T[s]);if(!sysList.length)sysList=Object.keys(T);
  const F=[[it.topic,3],[it.learning_objective,2],[it.question,1],[it.stem,0.3]].filter(f=>f[0]).map(([t,w])=>({raw:String(t).toLowerCase(),n:nk(t),w}));
  if(!F.length)return null;
  let best=null;
  for(const sys of sysList)for(const name of T[sys]){
    let sc=0;const nn=nk(name);
    if(F[0]&&it.topic&&F[0].n.includes(nn))sc+=5;
    for(const m of SUBM[it.subject+'|'+sys+'|'+name]||[])for(const f of F)if(m.re?m.re.test(f.raw):f.n.includes(m.s))sc+=f.w*m.w;
    if(sc>(best?best.sc:0))best={sys,name,sc};
  }
  return best&&best.sc>=2.5?best:null;
}
function normClass(it){
  const snap=()=>JSON.stringify([it.subject,it.system,it.related_systems,it.subtopic,it.subtopic_auto]);const before=snap();
  it.subject=canon(it.subject,SUBJ_ALIASES)||'미분류';
  let sys=it.system,rel=it.related_systems!=null?it.related_systems:(it.secondary_systems||[]);
  delete it.secondary_systems;
  if(!Array.isArray(rel))rel=String(rel).split(/[,/+;]/);
  if(Array.isArray(sys)){rel=[...sys.slice(1),...rel];sys=sys[0];}
  else if(typeof sys==='string'&&/[,/+;]/.test(sys)&&!SYS_ALIASES[sys.trim()]){const p=sys.split(/[,/+;]/);sys=p[0];rel=[...p.slice(1),...rel];}
  let c=canon(sys,SYS_ALIASES);
  // '내과 › 신경과'처럼 과목명이 분과 자리에 들어오면 과목으로 올린다
  const asSubj=canon(c,SUBJ_ALIASES);
  if(c&&SUBJ_ALIASES[asSubj]&&asSubj!==it.subject&&!(TAX[it.subject]||{})[c]){it.subject=asSubj;c='';}
  const T=TAX[it.subject];
  const cands=AMBIG[c]?AMBIG[c]:(c?[c]:[]);
  let finalSys=AMBIG[c]?'':c;
  const relC=[];rel.forEach(x=>{const k=canon(x,SYS_ALIASES);if(AMBIG[k])relC.push(...AMBIG[k]);else if(k)relC.push(k);});
  const sub=it.subtopic!=null?String(it.subtopic).trim():'';
  if(T){
    const hit=sub?findSub(it.subject,sub,cands):null;
    if(hit){if(finalSys&&finalSys!==hit.sys&&T[finalSys])relC.push(finalSys);finalSys=hit.sys;it.subtopic=hit.name;}
    else{
      const r=classifySub(it,cands);
      if(r&&(!finalSys||!T[finalSys]||cands.includes(r.sys))){finalSys=r.sys;it.subtopic=r.name;it.subtopic_auto=true;}
      else{it.subtopic='';delete it.subtopic_auto;if(!finalSys&&cands.length)finalSys=cands[0];}
    }
  }else if(sub)it.subtopic=sub;
  it.system=finalSys;
  it.related_systems=[...new Set(relC.filter(x=>x&&x!==finalSys))];
  if(!it.subtopic)delete it.subtopic;
  return before!==snap();
}
const primSys=it=>it.system||NOSYS;
const subOf=it=>it.subtopic||NOSUB;
const allSys=it=>[primSys(it),...(it.related_systems||[])];
const sysSort=(a,b)=>{const ia=SYS_ORDER.indexOf(a),ib=SYS_ORDER.indexOf(b);if(a===NOSYS)return 1;if(b===NOSYS)return -1;return(ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);};
// 한 분과 안의 세부 주제 목록: 표준 목록 순서 + 표준 밖 주제 + 미지정
function subsFor(subj,sys,items){
  const base=sys===NOSYS?[]:[...subList(subj,sys)];
  const extra=new Set();let none=false;
  for(const it of items)if((it.subject||'미분류')===subj&&primSys(it)===sys){if(!it.subtopic)none=true;else if(!base.includes(it.subtopic))extra.add(it.subtopic);}
  return[...base,...[...extra].sort(),...(none?[NOSUB]:[])];
}

/* ============ 입력 파싱 & 적재 ============ */
function parseInput(text){
  const blocks=[];const re=/```(?:json)?\s*([\s\S]*?)```/gi;let m;
  while((m=re.exec(text)))blocks.push(m[1]);
  if(!blocks.length)blocks.push(text);
  const out=[];
  for(let b of blocks){
    b=b.trim();const s=b.search(/[\[{]/);if(s<0)continue;b=b.slice(s);
    const e=Math.max(b.lastIndexOf('}'),b.lastIndexOf(']'));if(e<0)continue;b=b.slice(0,e+1);
    try{out.push(JSON.parse(b));}
    catch(e1){try{out.push(JSON.parse(b.replace(/,\s*([}\]])/g,'$1')));}catch(e2){throw new Error('JSON 해석 실패: '+e1.message+' — 사용하는 AI에게 "유효한 JSON으로 다시 출력"을 요청하세요.');}}
  }
  if(!out.length)throw new Error('JSON을 찾지 못했습니다.');
  return out;
}
function extractItems(data){
  if(!data||typeof data!=='object')return{items:[],metas:[]};
  if(Array.isArray(data)){const items=[],metas=[],cls=[];for(const d of data){const r=extractItems(d);items.push(...r.items);metas.push(...r.metas);cls.push(...(r.cls||[]));}return{items,metas,cls};}
  if(data.schema==='kmle-qbank-backup')return{items:Object.values(data.bank||{}),metas:[]};
  if(Array.isArray(data.classifications))return{items:[],metas:[],cls:data.classifications};
  if(Array.isArray(data.items))return{items:data.items,metas:data.batch_meta?[data.batch_meta]:[]};
  if(data.stem)return{items:[data],metas:[]};
  return{items:[],metas:data.batch_meta?[data.batch_meta]:[]};
}
function normalizeItem(raw){
  const it=JSON.parse(JSON.stringify(raw||{}));
  const toL=x=>{let s=String(x==null?'':x).trim();if(CIR2L[s[0]])return CIR2L[s[0]];s=s.toUpperCase().replace(/[^A-F]/g,'');return s.slice(0,1);};
  if(Array.isArray(it.options))it.options=it.options.map((o,i)=>typeof o==='string'?{label:LABELS[i],text:o}:{label:toL(o.label)||LABELS[i],text:o.text!=null?o.text:(o.content||'')});
  if(it.answer!=null)it.answer=toL(it.answer);
  let oa=it.option_analysis;
  if(Array.isArray(oa)){const m={};oa.forEach((x,i)=>{m[toL(x&&x.label)||LABELS[i]]=x;});oa=m;}
  if(oa&&typeof oa==='object'){const m={};for(const[k,v]of Object.entries(oa))m[toL(k)||k]=v;it.option_analysis=m;}
  if(it.difficulty!=null)it.difficulty=Number(it.difficulty)||null;
  normClass(it);
  delete it.temp_id;
  return it;
}
function validate(it){
  const errs=[],warns=[];
  if(!it.stem)errs.push('stem 없음');
  if(!Array.isArray(it.options)||it.options.length<2)errs.push('options 없음');
  else if(it.options.length!==5)warns.push(`선지 ${it.options.length}개`);
  const labels=(it.options||[]).map(o=>o.label);
  if(!it.answer||!labels.includes(it.answer))errs.push('answer가 선지에 없음');
  const oa=it.option_analysis||{};
  const miss=labels.filter(l=>!oa[l]);if(miss.length)warns.push('해설 누락 선지 '+miss.join(','));
  const corr=labels.filter(l=>oa[l]&&oa[l].verdict==='correct');
  if(corr.length>1)errs.push('verdict=correct 선지가 2개 이상 (두 정답)');
  if(corr.length===1&&corr[0]!==it.answer)errs.push('answer와 정답 해설 불일치');
  if(it.needs_review)warns.push('needs_review');
  if(it.generator_confidence&&it.generator_confidence!=='high')warns.push('생성 확신도 '+it.generator_confidence);
  return{errs,warns};
}
function ingestData(list,source,opts={update:true}){
  const rep={added:0,updated:0,dup:0,invalid:[],warned:[],metas:[],cls:0,clsMiss:[]};
  const batchId='B'+Date.now().toString(36);
  for(const data of list){
    const{items,metas,cls}=extractItems(data);rep.metas.push(...metas);
    for(const c of cls||[]){
      const it=c&&S.bank[c.id];if(!it){rep.clsMiss.push(String(c&&c.id));continue;}
      if(c.subject)it.subject=c.subject;if(c.system!=null)it.system=c.system;if(c.related_systems!=null)it.related_systems=c.related_systems;
      it.subtopic=c.subtopic||'';delete it.subtopic_auto;normClass(it);rep.cls++;
    }
    for(const raw of items){
      const it=normalizeItem(raw);const v=validate(it);
      if(v.errs.length){rep.invalid.push({stem:norm(it.stem).slice(0,50),errs:v.errs});continue;}
      const id=it.id||makeId(it);
      if(!opts.update&&S.meta.deleted.includes(id))continue;
      const exist=S.bank[id];
      if(exist){
        if(!opts.update){rep.dup++;continue;}
        if(JSON.stringify(strip(exist))===JSON.stringify(strip(Object.assign({},it,{id})))){rep.dup++;continue;}
        it.id=id;it._added=exist._added;it._source=source;it._updated=Date.now();S.bank[id]=it;delete S.flags[id];rep.updated++;continue;
      }
      it.id=id;it._added=Date.now();it._source=source;it._batch=batchId;S.bank[id]=it;rep.added++;
      if(v.warns.length)rep.warned.push({id,warns:v.warns});
    }
  }
  if((rep.added||rep.updated)&&!source.startsWith('repo'))S.meta.batches.push({id:batchId,ts:Date.now(),source,added:rep.added,updated:rep.updated,metas:rep.metas});
  return rep;
}
function reportHTML(rep){
  if(rep.cls&&!rep.added&&!rep.updated&&!rep.dup&&!rep.invalid.length)return `<div class="banner ok">세부 주제 분류 <b>${rep.cls}</b>개 반영${rep.clsMiss.length?` · 찾을 수 없는 id ${rep.clsMiss.length}개`:''}</div>`;
  let h=`<div class="banner ${rep.added||rep.updated||rep.cls?'ok':'info'}">새 문항 <b>${rep.added}</b>개 추가${rep.updated?` · 수정본 반영 <b>${rep.updated}</b>개`:''}${rep.cls?` · 분류 반영 <b>${rep.cls}</b>개`:''} · 중복 ${rep.dup}개 건너뜀${rep.invalid.length?` · <b>형식 오류 ${rep.invalid.length}개 제외</b>`:''}</div><div class="rep">`;
  for(const x of rep.invalid)h+=`<div class="bad-t">✗ "${esc(x.stem)}…" — ${esc(x.errs.join(', '))}</div>`;
  for(const x of rep.warned)h+=`<div class="warn">△ <span class="mono">${esc(x.id)}</span> — ${esc(x.warns.join(', '))}</div>`;
  for(const m of rep.metas){
    if((m.conflicts||[]).length)h+=`<div class="warn">⚠ Gemini 보고 — 근거 충돌: ${esc(JSON.stringify(m.conflicts))}</div>`;

function statsMap(){const m={};for(const a of S.attempts){const s=m[a.qid]||(m[a.qid]={n:0,c:0,w:0,danger:0,last:null});s.n++;if(a.correct)s.c++;else{s.w++;if(a.conf===3)s.danger++;}s.last=a;}return m;}
const isDue=(id,now)=>{const s=S.srs[id];return!!(s&&s.due<=now);};
const dangerOpen=st=>!!(st&&st.danger>0&&!(st.last.correct&&st.last.conf===3));
const unresolved=st=>!!(st&&(!st.last.correct||dangerOpen(st)));
function updateSrs(id,a){
  const s=S.srs[id]||{iv:0,reps:0,lapses:0};let iv;
  if(!a.correct){s.lapses++;iv=a.conf===3?0:1;}
  else if(a.conf===1)iv=1;
  else if(a.conf===2)iv=Math.max(2,Math.round((s.iv||1)*1.8));
  else iv=Math.max(3,Math.round((s.iv||1)*2.5));
  iv=Math.min(iv,180);s.iv=iv;s.reps++;s.last=a.ts;s.due=a.ts+(iv===0?10*60*1000:iv*DAY);S.srs[id]=s;
}
function nextLabel(id){const s=S.srs[id];if(!s)return'—';const d=(s.due-Date.now())/DAY;return d<1/24?'곧':d<1?Math.round(d*24)+'시간 후':Math.round(d)+'일 후';}
function calib(atts){return[1,2,3].map(c=>{const a=atts.filter(x=>x.conf===c);return{c,n:a.length,acc:a.length?a.filter(x=>x.correct).length/a.length:null};});}
function calibTable(cal){
  const rows=cal.map(r=>`<tr><td>${r.c} · ${CONF_KO[r.c]}</td><td class="mono">${r.n}</td><td class="mono">${pct(r.acc)}</td><td><div class="bar"><i style="width:${r.acc==null?0:Math.round(r.acc*100)}%"></i></div></td></tr>`).join('');
  const c1=cal[0],c3=cal[2];let note='';
  if(c3.n>=5&&c3.acc<0.9)note+=`<div class="warn">확신 과잉: '확실'이라고 답한 문항의 정답률이 ${pct(c3.acc)}입니다. 이 간극이 실전에서 가장 비싼 착각입니다.</div>`;
  if(c1.n>=5&&c1.acc>0.6)note+=`<div class="mut">과소 확신: '찍음'의 정답률이 ${pct(c1.acc)}입니다. 알고 있는데 스스로 믿지 못하는 영역입니다.</div>`;
  if(!note&&cal.some(r=>r.n<5))note='<div class="mut">확신도별 5회 이상 쌓이면 해석이 표시됩니다. 이상적인 모습: 확실 ≥ 90%, 찍음 ≈ 20–30%.</div>';
  return `<div class="tblwrap"><table class="tbl"><tr><th>확신도</th><th>시도</th><th>정답률</th><th></th></tr>${rows}</table></div>${note}`;
}
function misTally(atts){
  const t={};
  for(const a of atts){if(a.correct||a.skipped)continue;const it=S.bank[a.qid];if(!it)continue;
    const oa=(it.option_analysis||{})[a.choice]||{};const tag=oa.misconception||(it.misconception_tags||[])[0]||'(태그 없음)';
    const e=t[tag]||(t[tag]={tag,n:0,d:0,topics:new Set()});e.n++;if(a.conf===3)e.d++;if(it.topic)e.topics.add(it.topic);}
  return Object.values(t).sort((x,y)=>(y.n+y.d)-(x.n+x.d));
}

function weaknessPacket(atts,onlyUnresolved){
  const sm=statsMap();const by={};
  for(const a of atts){if(a.skipped||a.correct)continue;const e=by[a.qid]||(by[a.qid]={w:0,d:0,ch:new Set(),lastConf:a.conf});e.w++;if(a.conf===3)e.d++;e.ch.add(a.choice);e.lastConf=a.conf;}
  const rows=Object.entries(by).filter(([q])=>S.bank[q]&&(!onlyUnresolved||unresolved(sm[q]))).map(([qid,e])=>{
    const it=S.bank[qid];const ch=[...e.ch];
    return{qid,subject:it.subject,system:it.system,subtopic:it.subtopic||'',related_systems:it.related_systems||[],topic:it.topic,learning_objective:it.learning_objective,question_type:it.question_type,difficulty:it.difficulty,
      answer:it.answer,chosen:ch,chosen_misconceptions:ch.map(c=>((it.option_analysis||{})[c]||{}).misconception).filter(Boolean),
      wrong_count:e.w,dangerous_count:e.d,last_confidence:e.lastConf,takeaway:it.takeaway,misconception_tags:it.misconception_tags||[]};
  }).sort((a,b)=>(b.dangerous_count*2+b.wrong_count)-(a.dangerous_count*2+a.wrong_count)).slice(0,30);
  if(!rows.length){toast('아직 오답 기록이 없습니다','err');return null;}

function coveragePacket(){

  P.push(`<h4>선지 전수 해부</h4>`);
  const known=['verdict','misconception','mechanism','why_best','trap','correct_when'];
  for(const o of(it.options||[])){
    const x=oa[o.label]||{},isAns=o.label===it.answer,mine=o.label===choice,R=[];

    for(const[k,v]of Object.entries(x))if(!known.includes(k)&&v)R.push([esc(k),fmt(typeof v==='string'?v:JSON.stringify(v))]);
    if(!R.length)R.push(['','<span class="warn">해설 누락 — 🚩 신고 후 /audit 권장</span>']);
    P.push(`<div class="oa${isAns?' ans':''}${mine&&!isAns?' mine':''}"><div class="oah"><span class="ol">${CIR[o.label]||o.label}</span><span class="oat">${fmt(o.text)}</span>${isAns?'<span class="bdg ok">정답</span>':''}${mine?'<span class="bdg me">내 선택</span>':''}</div><dl>${R.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl></div>`);

  if(it.kmle_link)M.push(`<div><span class="mut">기출 연결 </span>${fmt(it.kmle_link)}</div>`);
  if((it.source_refs||[]).length)M.push(`<div><span class="mut">근거 </span>${it.source_refs.map(r=>esc(typeof r==='string'?r:[r.file,r.section].filter(Boolean).join(' › '))).join(' / ')}</div>`);

// 분과 정답률은 연계 문항 풀이까지 포함 — 그 분과 지식이 실제로 시험된 모든 기회를 반영.
function subjectTable(items,sm){
  const T={};
  const cell=()=>({n:0,rel:0,att:0,c:0,t:0});
  const stKey=it=>(it.subject||'미분류')+'|'+primSys(it)+'|'+subOf(it);
  const ST={};
  for(const it of items){
    const s=it.subject||'미분류';const sub=T[s]||(T[s]={tot:cell(),sys:{}});
    sub.tot.n++;if(sm[it.id])sub.tot.att++;
    allSys(it).forEach((y,i)=>{const e=sub.sys[y]||(sub.sys[y]=cell());if(i===0)e.n++;else e.rel++;if(sm[it.id])e.att++;});
    const k=stKey(it),e=ST[k]||(ST[k]=cell());e.n++;if(sm[it.id])e.att++;
  }
  for(const a of S.attempts){
    const it=S.bank[a.qid];if(!it)continue;const sub=T[it.subject||'미분류'];if(!sub)continue;
    sub.tot.t++;if(a.correct)sub.tot.c++;
    for(const y of allSys(it)){const e=sub.sys[y];if(e){e.t++;if(a.correct)e.c++;}}
    const e=ST[stKey(it)];if(e){e.t++;if(a.correct)e.c++;}
  }

      body+=row('sys'+(subs.length?' tog':'')+(weak&&weak.s===s&&weak.y===y?' weak':'')+(!e.n&&!e.rel?' zero':''),lab,e,true,subs.length?` data-act="toggleSys" data-k="${esc(key)}"`:'');
      if(open)for(const x of subs){const k=s+'|'+y+'|'+x,c=ST[k]||cell();
        body+=row('st'+(c.n?'':' zero')+(weakSt&&weakSt.k===k?' weak':''),esc(x)+(TAX_ADDED.has(y+'|'+x)?' <span class="mut" title="참고자료에 없어 추가한 항목">＋</span>':''),c,false);}
    }

  ${weak?`<div class="bad-t cap">가장 약한 분과: ${esc(weak.s)} › ${esc(weak.y)} — 정답률 ${pct(weak.acc)} (${weak.t}회).</div>`:''}
  ${wl?`<div class="bad-t cap">가장 약한 세부 주제: ${esc(wl[1])} › ${esc(wl[2])} — 정답률 ${pct(weakSt.acc)} (${weakSt.t}회). 문제 풀기에서 이 주제만 골라 집중해 보세요.</div>`:''}
  <div class="mut cap">분과를 누르면 세부 주제가 펼쳐집니다. 분과 옆 숫자(예: 9/14)는 문항이 1개 이상 있는 세부 주제 수 / 전체 세부 주제 수 — 흐린 줄은 아직 문항이 없는 빈 영역입니다. 문항 = 주 분과 기준(과목 합계와 일치). ${hasRel?'연계 = 다른 분과가 주이지만 이 분과 지식도 필요한 다학제 문항 수. ':''}분과 정답률은 연계 문항까지, 세부 주제 정답률은 주 분과 문항만 포함합니다.</div></div>`;
}

function pool(f=setup){
  const sm=statsMap(),now=Date.now(),kw=(f.kw||'').trim().toLowerCase();
  const subSel=new Set(f.subtopics||[]),sysWithSub=new Set([...subSel].map(k=>k.split('|').slice(0,2).join('|')));
  let ids=Object.values(S.bank).filter(it=>{
    if(f.track==='kmle'&&it.block_id)return false;
    if(f.track==='school'&&!it.block_id)return false;
    if(f.subjects.length&&!f.subjects.includes(it.subject||'미분류'))return false;
    if(f.systems.length){
      const M=allSys(it).filter(y=>f.systems.includes(y));if(!M.length)return false;
      // 세부 주제를 고른 분과는 그 주제만, 고르지 않은 분과는 전체
      if(subSel.size&&!M.some(y=>!sysWithSub.has(it.subject+'|'+y)||(y===primSys(it)&&subSel.has(it.subject+'|'+y+'|'+subOf(it)))))return false;
    }
    const d=it.difficulty;if(d!=null&&((f.dmin&&d<f.dmin)||(f.dmax&&d>f.dmax)))return false;
    if(f.exFlag&&S.flags[it.id])return false;
    if(kw){const hay=[it.topic,it.system,it.subtopic,it.subject,it.learning_objective,(it.misconception_tags||[]).join(' ')].join(' ').toLowerCase();if(!hay.includes(kw))return false;}
    return true;
  }).map(it=>it.id);
  const st=id=>sm[id],byDue=(a,b)=>S.srs[a].due-S.srs[b].due;
  switch(f.mode){
    case 'new':ids=shuffle(ids.filter(id=>!st(id)));break;
    case 'due':ids=ids.filter(id=>isDue(id,now)).sort(byDue);break;
    case 'wrong':ids=shuffle(ids.filter(id=>st(id)&&!st(id).last.correct));break;
    case 'danger':ids=shuffle(ids.filter(id=>dangerOpen(st(id))));break;
    case 'random':ids=shuffle(ids);break;
    default:{const due=ids.filter(id=>isDue(id,now)).sort(byDue),nw=shuffle(ids.filter(id=>!st(id))),rest=shuffle(ids.filter(id=>st(id)&&!isDue(id,now)));ids=[...due,...nw,...rest];}
  }
  return ids;
}
function updatePool(){const el=$('#poolInfo');if(!el)return;const n=pool().length;el.textContent=`조건에 맞는 문항 ${n}개 → 이번 세션 ${Math.min(n,setup.n||0)}문항`;}
function setupScope(items){return items.filter(i=>!setup.subjects.length||setup.subjects.includes(i.subject||'미분류'));}
function sysChips(items){
  const scope=setupScope(items).filter(it=>setup.track==='all'||(setup.track==='school'?!!it.block_id:!it.block_id));
  const cnt={};scope.forEach(i=>allSys(i).forEach(y=>{cnt[y]=(cnt[y]||0)+1;}));
  const subjIn=[...new Set(scope.map(i=>i.subject||'미분류'))];
  subjIn.forEach(s=>Object.keys(TAX[s]||{}).forEach(y=>{if(!cnt[y])cnt[y]=0;}));
  const ys=Object.keys(cnt).sort(sysSort);if(!ys.length||(ys.length===1&&ys[0]===NOSYS))return'';
  let h=`<h3>분과 (선택하지 않으면 전체 · 연계 문항 포함)</h3><div class="chips">${ys.map(y=>`<label class="chip${cnt[y]?'':' zero'}"><input type="checkbox" data-set="sys" value="${esc(y)}"${setup.systems.includes(y)?' checked':''}${cnt[y]?'':' disabled'}>${esc(y)} <span class="mut mono">${cnt[y]}</span></label>`).join('')}</div>`;
  if(!setup.systems.length)return h+`<div class="mut cap">분과를 고르면 그 아래 세부 주제를 선택할 수 있습니다.</div>`;
  h+=`<h3>세부 주제 (선택하지 않은 분과는 전체 출제)</h3>`;
  for(const y of [...setup.systems].sort(sysSort)){
    const subjs=[...new Set([...subjIn.filter(s=>(TAX[s]||{})[y]),...scope.filter(i=>primSys(i)===y).map(i=>i.subject||'미분류')])];
    for(const s of subjs){
      const subs=subsFor(s,y,scope);if(!subs.length)continue;
      const c={};scope.forEach(i=>{if((i.subject||'미분류')===s&&primSys(i)===y){const k=subOf(i);c[k]=(c[k]||0)+1;}});
      const unsure=scope.filter(i=>(i.subject||'미분류')===s&&primSys(i)===y&&i.subtopic_auto).length;
      h+=`<div class="subgrp"><div class="subgrp-h">${esc(y)}${subjs.length>1?` <span class="mut">(${esc(s)})</span>`:''}${unsure?` <span class="mut" style="font-weight:400">· 자동 추정 ${unsure}개 포함</span>`:''}</div><div class="chips">${subs.map(x=>{const v=s+'|'+y+'|'+x,n=c[x]||0;
        return `<label class="chip${n?'':' zero'}"><input type="checkbox" data-set="sub" value="${esc(v)}"${setup.subtopics.includes(v)?' checked':''}${n?'':' disabled'}>${esc(x)} <span class="mut mono">${n}</span></label>`;}).join('')}</div></div>`;
    }
  }
  return h;
}

async function submit(){

  const rec={qid:id,ts:Date.now(),choice:session.choice,conf:session.conf,correct:session.choice===it.answer,ms:Date.now()-session.qt};

    if(browse.subj&&(it.subject||'미분류')!==browse.subj)return false;

    if(browse.sys&&browse.sub&&!(primSys(it)===browse.sys&&subOf(it)===browse.sub))return false;

function mergeBackup(b){
  let items=0,atts=0;
  for(const it of Object.values(b.bank||{}))if(it&&it.id&&!S.bank[it.id]){S.bank[it.id]=it;items++;}
  const seen=new Set(S.attempts.map(a=>a.qid+'|'+a.ts));
  for(const a of(b.attempts||[])){const k=a.qid+'|'+a.ts;if(!seen.has(k)){S.attempts.push(a);seen.add(k);atts++;}}
  S.attempts.sort((x,y)=>x.ts-y.ts);
  for(const[k,v]of Object.entries(b.srs||{}))if(!S.srs[k]||(v.last||0)>(S.srs[k].last||0))S.srs[k]=v;
  Object.assign(S.flags,b.flags||{});
  if(b.meta&&Array.isArray(b.meta.batches)){const ids=new Set(S.meta.batches.map(x=>x.id));for(const x of b.meta.batches)if(!ids.has(x.id))S.meta.batches.push(x);}
  return{items,atts};
}

  if(k==='track'){setup.track=t.value;render();return;}
  if(k==='subj'){setup.subjects=[...app.querySelectorAll('[data-set=subj]:checked')].map(x=>x.value);
    // 과목이 바뀌면 분과 목록도 바뀌므로 다시 그림. 범위 밖으로 나간 분과 선택은 해제
    const scope=Object.values(S.bank).filter(i=>!setup.subjects.length||setup.subjects.includes(i.subject||'미분류'));
    const valid=new Set(scope.flatMap(allSys));setup.systems=setup.systems.filter(y=>valid.has(y));setup.subtopics=setup.subtopics.filter(v=>setup.systems.includes(v.split('|')[1]));
    if(!onSetup._busy){onSetup._busy=true;render();onSetup._busy=false;}return;}
  else if(k==='sys'){setup.systems=[...app.querySelectorAll('[data-set=sys]:checked')].map(x=>x.value);
    setup.subtopics=setup.subtopics.filter(v=>setup.systems.includes(v.split('|')[1]));
    if(!onSetup._busy){onSetup._busy=true;render();onSetup._busy=false;}return;}
  else if(k==='sub')setup.subtopics=[...app.querySelectorAll('[data-set=sub]:checked')].map(x=>x.value);
  else if(k==='exFlag')setup.exFlag=t.checked;
  else if(k==='showMeta'){S.meta.showMeta=t.checked;save('meta');return;}
  else if(k==='n'||k==='dmin'||k==='dmax')setup[k]=Number(t.value)||0;
  else setup[k]=t.value;
  updatePool();
}
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.set)onSetup(t);if(t.dataset.b){browse[t.dataset.b]=t.value;browse.limit=50;$('#blist').innerHTML=browseList();}});
app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.set){onSetup(t);return;}
  if(t.dataset.b&&t.tagName==='SELECT'){browse[t.dataset.b]=t.value;browse.limit=50;if(t.dataset.b==='sys'){browse.sub='';render();}else $('#blist').innerHTML=browseList();return;}
  if(t.dataset.rc&&(t.dataset.rc==='subj'||t.dataset.rc==='sys')){const box=t.closest('.rc');box.outerHTML=rcEditor(box.dataset.rcid,rcRead(box));return;}
  if(t.id!=='files'&&t.id!=='bfile')return;
  const files=[...t.files],parsed=[],errs=[];
  for(const f of files){
    try{const txt=await f.text();
      if(t.id==='bfile'){const d=JSON.parse(txt);if(d.schema==='kmle-qbank-backup'){const r=mergeBackup(d);await saveAll();toast(`백업 병합 완료: 문항 +${r.items}, 풀이 기록 +${r.atts}`);t.value='';render();return;}parsed.push(d);}
      else parsed.push(...parseInput(txt));
    }catch(err){errs.push(f.name+': '+err.message);}
  }
  t.value='';
  if(parsed.length){const rep=ingestData(parsed,'file:'+files.map(f=>f.name).join(','));await saveAll();
    if($('#report'))$('#report').innerHTML=reportHTML(rep)+errs.map(x=>`<div class="bad-t">${esc(x)}</div>`).join('');else{toast(`문항 +${rep.added}`);render();}}
  else if(errs.length){if($('#report'))$('#report').innerHTML=`<div class="banner bad">${errs.map(esc).join('<br>')}</div>`;else toast(errs[0],'err');}
});
app.addEventListener('toggle',e=>{
  const d=e.target;if(!(d instanceof HTMLDetailsElement)||!d.open)return;
  const body=d.querySelector('.dbody');if(!body||body.dataset.done)return;const it=S.bank[d.dataset.id];if(!it)return;
  const choice=d.hasAttribute('data-choice')?(d.dataset.choice||null):lastChoice(it.id);
  body.innerHTML=detailBody(it,choice,d.dataset.ctx);body.dataset.done='1';
},true);
document.addEventListener('keydown',e=>{
  if(route!=='quiz'||!session||session.done)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const id=session.ids[session.i],it=S.bank[id];if(!it)return;const revealed=!!session.ans[id],k=e.key.toLowerCase();
  if(!revealed){
    if(k.length===1&&'abcdef'.includes(k)&&it.options.some(o=>o.label===k.toUpperCase())){session.choice=k.toUpperCase();render();}
    else if(k==='1'||k==='2'||k==='3'){session.conf=+k;render();}
    else if(k==='enter'&&session.choice&&session.conf){e.preventDefault();submit();}
  }else if(k==='enter'){e.preventDefault();next();}
});

</script>
